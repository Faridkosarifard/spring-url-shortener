spring:
  application:
    name: spring-url-shortener
  datasource:
    url: jdbc:h2:mem:shorturl;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

shorturl:
  base-url: ${SHORTURL_BASE_URL:http://localhost:8080}
  code-length: ${SHORTURL_CODE_LENGTH:7}
  max-code-attempts: ${SHORTURL_MAX_CODE_ATTEMPTS:8}
  redirect-status: ${SHORTURL_REDIRECT_STATUS:302}
  block-private-hosts: ${SHORTURL_BLOCK_PRIVATE_HOSTS:true}
  reserved-codes:
    - api
    - actuator
    - error
    - swagger-ui
    - swagger-ui.html
    - v3
    - favicon.ico
    - h2-console
  rate-limit:
    enabled: ${SHORTURL_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${SHORTURL_RATE_LIMIT_RPM:60}
    trust-forwarded-headers: ${SHORTURL_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
